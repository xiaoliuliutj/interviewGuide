services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: interview_agent
      POSTGRES_USER: interview_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_agent -d interview_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  agent:
    build: .
    environment:
      INTERVIEW_GUIDE_POSTGRES_URL: postgresql://interview_agent:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/interview_agent
      INTERVIEW_GUIDE_REDIS_URL: redis://redis:6379/0
      INTERVIEW_GUIDE_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      INTERVIEW_GUIDE_OPENAI_BASE_URL: ${INTERVIEW_GUIDE_OPENAI_BASE_URL}
      INTERVIEW_GUIDE_OPENAI_MODEL: ${INTERVIEW_GUIDE_OPENAI_MODEL}
      INTERVIEW_GUIDE_OPENAI_API_KEY: ${INTERVIEW_GUIDE_OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
