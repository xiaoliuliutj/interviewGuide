services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: interview_agent
      POSTGRES_USER: interview_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_agent -d interview_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent:
    build: ./agent
    env_file: ./agent/.env
    environment:
      INTERVIEW_GUIDE_POSTGRES_URL: postgresql://interview_agent:${POSTGRES_PASSWORD}@postgres:5432/interview_agent
      INTERVIEW_GUIDE_REDIS_URL: redis://redis:6379/0
      INTERVIEW_GUIDE_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  interview-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: Interview
    environment: &java-environment
      SERVER_PORT: 8080
      INTERVIEW_GUIDE_JAVA_POSTGRES_URL: jdbc:postgresql://postgres:5432/interview_agent
      INTERVIEW_GUIDE_JAVA_POSTGRES_USERNAME: interview_agent
      INTERVIEW_GUIDE_JAVA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INTERVIEW_GUIDE_AGENT_BASE_URL: http://agent:8000
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started

  resume-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: Resume
    environment: *java-environment
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started

  knowledgebase-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: KnowledgeBase
    environment: *java-environment
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - interview-backend
      - resume-backend
      - knowledgebase-backend

volumes:
  postgres-data:
  redis-data:
