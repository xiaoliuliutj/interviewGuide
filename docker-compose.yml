services:
  postgres:
    image: ${DOCKER_IMAGE_PREFIX:-}pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: interview_agent
      POSTGRES_USER: interview_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_agent -d interview_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${DOCKER_IMAGE_PREFIX:-}redis:7
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: ${DOCKER_IMAGE_PREFIX:-}rabbitmq:3-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  agent:
    build:
      context: ./agent
      args:
        PYTHON_IMAGE: ${DOCKER_IMAGE_PREFIX:-}python:3.12-slim
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file: ./agent/.env
    environment:
      INTERVIEW_GUIDE_POSTGRES_URL: postgresql://interview_agent:${POSTGRES_PASSWORD}@postgres:5432/interview_agent
      INTERVIEW_GUIDE_REDIS_URL: redis://redis:6379/0
      INTERVIEW_GUIDE_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  interview-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: Interview
        MAVEN_IMAGE: ${DOCKER_IMAGE_PREFIX:-}maven:3.9.9-eclipse-temurin-21
        JRE_IMAGE: ${DOCKER_IMAGE_PREFIX:-}eclipse-temurin:21-jre
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://repo.maven.apache.org/maven2}
    environment: &java-environment
      SERVER_PORT: 8080
      INTERVIEW_GUIDE_JAVA_POSTGRES_URL: jdbc:postgresql://postgres:5432/interview_agent
      INTERVIEW_GUIDE_JAVA_POSTGRES_USERNAME: interview_agent
      INTERVIEW_GUIDE_JAVA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INTERVIEW_GUIDE_AGENT_BASE_URL: http://agent:8000
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'HTTP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy

  resume-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: Resume
        MAVEN_IMAGE: ${DOCKER_IMAGE_PREFIX:-}maven:3.9.9-eclipse-temurin-21
        JRE_IMAGE: ${DOCKER_IMAGE_PREFIX:-}eclipse-temurin:21-jre
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://repo.maven.apache.org/maven2}
    environment: *java-environment
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'HTTP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy

  knowledgebase-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: KnowledgeBase
        MAVEN_IMAGE: ${DOCKER_IMAGE_PREFIX:-}maven:3.9.9-eclipse-temurin-21
        JRE_IMAGE: ${DOCKER_IMAGE_PREFIX:-}eclipse-temurin:21-jre
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://repo.maven.apache.org/maven2}
    environment: *java-environment
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'HTTP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${DOCKER_IMAGE_PREFIX:-}node:20-alpine
        NGINX_IMAGE: ${DOCKER_IMAGE_PREFIX:-}nginx:1.27-alpine
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "80:80"
    depends_on:
      interview-backend:
        condition: service_healthy
      resume-backend:
        condition: service_healthy
      knowledgebase-backend:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
